

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-xl py-3  navbar-light bg-primary">
        <div class="container-fluid">

          <a class="navbar-brand  text-white" href="bills.html">Billing Software</a>
          
          <div class="collapse navbar-collapse" id="navbarNav">
            <form class="d-flex ms-auto">
              <input class="form-control me-2 w-auto" type="search" placeholder="Search" aria-label="Search">
              <button class="btn btn-outline-white bg-warning" type="submit">Search</button>
            </form>
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link text-white" href="#"><i class="bi bi-bell"></i> Notifications</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white" href="#"><i class="bi bi-person-circle"></i> Profile</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <div class="container mt-4">
      <div class="text-center"><h3>Add Product</h3></div>
        <form>
          <div class="mb-3">
            <label for="productName" class="form-label">Product Name</label>
            <input type="text" class="form-control" id="productName" placeholder="Enter product name">
          </div>
          <div class="mb-3">
            <label for="productPrice" class="form-label">Product Price</label>
            <input type="number" class="form-control" id="productPrice" placeholder="Enter product price">
          </div>
          <div class="mb-3">
            <label for="productQuantity" class="form-label">Product Quantity</label>
            <input type="number" class="form-control" id="productQuantity" placeholder="Enter product quantity">
          </div>
          <div class="mb-3">
            <label for="productBrand" class="form-label">Product Brand</label>
            <input type="text" class="form-control" id="productBrand" placeholder="Enter product brand">
          </div>
          <div class="mb-3">
            <label for="productSupplier" class="form-label">Product Supplier</label>
            <input type="text" class="form-control" id="productSupplier" placeholder="Enter product supplier">
          </div>
          <div class="mb-3">
            <label for="productCategory" class="form-label">Product Category</label>
            <input type="text" class="form-control" id="productCategory" placeholder="Enter product category">
          </div>
          <div class="text-center"><button type="submit" class="btn btn-primary">Save</button></div>
        </form>
      </div>
      
   

  
    
      
</body>
</html>

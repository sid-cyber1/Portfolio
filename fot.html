<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        footer {
            background-color: #111;
        }

        .footercontainer {
            width: 100%;
            padding: 70px 30px 20px;
        }

        .socialicons {
            display: flex;
            justify-content: center;

        }

        .socialicons a {
            text-decoration: none;
            padding: 10px;
            background-color: white;
            margin: 10px;
            border-radius: 50%;

        }

        .socialicons a i {
            font-size: 2em;
            color: black;
            opacity: 0.9;
        }

        .socialicons a:hover {
            background-color: #111;
            transition: 0.5s;

        }

        .socialicons a:hover i {
            color: white;
            transition: 0.5s;
        }
        .footernav{
            margin: 30px 0;
        }
        .footernav ul {
                display: flex;
                justify-content: center;
        }
        .footernav ul li a{
            color: white;
            margin: 20px;
            text-decoration: none;
            font-size: 1.3em;
            opacity: 0.7;
            transition: 0.5;
        }
        .footernav ul li a:hover{
            opacity: 1;
        }
        .footerbottom{
            background-color: #000;
            padding: 20px;
            text-align: center;
        }
        .footerbottom p {
            color: white;
        }
    </style>
</head>

<body>
    <footer>
        <div class="footercontainer">
            <div class="socialicons">
                <a href="https://github.com/sid-cyber1"><i class="fa-brands fa-github"></i></a>
                <a href="https://www.linkedin.com/in/siddhesh-shelke-11a437230/"><i class="fa-brands fa-linkedin"></i></a>
                <a href="https://x.com/SidS57165816"><i class="fa-brands fa-twitter"></i></a>
                <a href="https://www.hackerrank.com/dashboard"><i class="fa-brands fa-hackerrank"></i></a>
            </div>
            <div class="footernav">
                <ul>
                    <li><a href="#">Home</a></li>
                </ul>
            </div>
           
        </div>
        <div class="footerbottom">
            <p>CopyRight &copy;2024 Designed by<span> Siddhesh shelke</span></p>
        </div>
    </footer>
</body>

</html>
